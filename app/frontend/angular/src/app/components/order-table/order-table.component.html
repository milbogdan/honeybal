<div class="rounded-xl overflow-hidden border border-gray-200">
  <div class="max-h-[233px] overflow-y-auto">
    <table class="min-w-full table-fixed divide-y divide-gray-200">
      <thead class="bg-gray-100 sticky top-0 z-10">
        <tr>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Id</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Adresa</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Komentar</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Status porudzbine</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Cena</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Način dostave</th>
          <th class="px-4 py-2 text-left text-sm font-semibold text-gray-700">Datum kreiranja porudzbine</th>
        </tr>
      </thead>
      <tbody class="bg-white text-sm">
        <tr *ngFor="let order of orders">
          <td class="px-4 py-2">#{{order.id}}</td>
          <td class="px-4 py-2">{{order.address}}</td>
          <td class="px-4 py-2">{{order.comment}}</td>
          <td class="px-4 py-2">{{order.statusOrder}}</td>
          <td class="px-4 py-2">{{order.price}}</td>
          <td class="px-4 py-2">{{order.deliveryTypeId}}</td>
          <td class="px-4 py-2">{{order.createOrder | date}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
