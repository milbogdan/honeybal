<div class="space-y-6 p-4">
  <!-- Categories Panel using p-panel -->
   <div class="mb-4">
    <p-panel header="Categories" [toggleable]="true" styleClass="rounded-xl shadow-sm">
      <div class="space-y-2">
        <div *ngFor="let category of categories" class="flex items-center gap-2">
          <input
            type="checkbox"
            [id]="'category-' + category.id"
            class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
            (change)="onCategoryChange(category, $event)"
          />
          <label [for]="'category-' + category.id" class="text-sm text-gray-700">
            {{ category.name }}
          </label>
        </div>
      </div>
    </p-panel>
  </div>

  <!-- Stock Panel using p-panel -->
  <p-panel header="In stock" [toggleable]="true" styleClass="rounded-xl shadow-sm">
    <div class="space-y-2">
      <div class="flex items-center gap-2">
        <input
          type="radio"
          name="stock"
          id="allStock"
          class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
          (change)="onStockChange(null)"
          checked
        />
        <label for="allStock" class="text-sm text-gray-700">All</label>
      </div>
      <div class="flex items-center gap-2">
        <input
          type="radio"
          name="stock"
          id="inStock"
          class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
          (change)="onStockChange(true)"
        />
        <label for="inStock" class="text-sm text-gray-700">In stock</label>
      </div>
      <div class="flex items-center gap-2">
        <input
          type="radio"
          name="stock"
          id="outStock"
          class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
          (change)="onStockChange(false)"
        />
        <label for="outStock" class="text-sm text-gray-700">Out of stock</label>
      </div>
    </div>
  </p-panel>
</div>
