spring.application.name=notification-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification-service}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8081

jwt.secret=${JWT_SECRET}
frontend.urls=${FRONTEND_URLS}
httponly.cookie.expiration=${HTTP_ONLY_COOKIE_EXPIRATION}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.name=notification-queue
rabbitmq.emailQueue.name=email-queue

